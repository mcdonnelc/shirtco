<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hat.co Quote UX Fixture</title>
    <link rel="stylesheet" href="../assets/quote-ux.css">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 16px; }
      .gform_page { display: block; }
      .wdac-form-products__quality-colors-wrapper { margin-top: 20px; }
      .wdac-form-products__quality-sizes-wrapper { margin-top: 20px; }
      .wdac-form-tooltiptext { visibility: hidden; position: absolute; }
    </style>
  </head>
  <body class="hatco-quote-ux">
    <main id="gform_wrapper_2" class="wdac-robust-form_wrapper">
      <form id="gform_2">
        <section id="gform_page_2_1" class="gform_page">
          <div class="wdac-form-products__quality-colors-wrapper">
            <h3>Select a color</h3>
            <div class="wdac-form-products__quality-colors">
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Black</span>
                <input class="js-wdac-checkbox" type="checkbox" name="black">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Black/White</span>
                <input class="js-wdac-checkbox" type="checkbox" name="black-white">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Charcoal/Neon Green</span>
                <input class="js-wdac-checkbox" type="checkbox" name="charcoal-neon-green">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">White/Navy/Red</span>
                <input class="js-wdac-checkbox" type="checkbox" name="white-navy-red">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Realtree Max7/Brown</span>
                <input class="js-wdac-checkbox" type="checkbox" name="realtree-max7-brown">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Heather Grey/Black</span>
                <input class="js-wdac-checkbox" type="checkbox" name="heather-grey-black">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Navy</span>
                <input class="js-wdac-checkbox" type="checkbox" name="navy">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Loden/Black</span>
                <input class="js-wdac-checkbox" type="checkbox" name="loden-black">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Red/White</span>
                <input class="js-wdac-checkbox" type="checkbox" name="red-white">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Columbia Blue/White</span>
                <input class="js-wdac-checkbox" type="checkbox" name="columbia-blue-white">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Cream/Navy/Amber Gold</span>
                <input class="js-wdac-checkbox" type="checkbox" name="cream-navy-gold">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Orange/White/Black</span>
                <input class="js-wdac-checkbox" type="checkbox" name="orange-white-black">
              </div>
              <div class="wdac-form-products__color js-wdac-checkbox-wrapper js-wdac-form-color">
                <span class="wdac-form-tooltiptext">Royal/White</span>
                <input class="js-wdac-checkbox" type="checkbox" name="royal-white">
              </div>
            </div>
          </div>
          <div class="wdac-form-products__quality-sizes-wrapper">
            <label for="fixture-quantity">Adjustable quantity</label>
            <div class="js-wdac-form-products-item-add-wrapper">
              <input id="fixture-quantity" class="js-wdac-form-products-item-add" type="number" value="12">
            </div>
          </div>
          <footer class="gform_page_footer">
            <input type="button" value="Next">
          </footer>
        </section>
      </form>
    </main>
    <script src="../assets/color-utils.js"></script>
    <script src="../assets/quote-ux.js"></script>
  </body>
</html>
